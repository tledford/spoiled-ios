name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find a simulator
        id: simulator
        run: |
          id=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime in sorted(devices, reverse=True) if 'iOS' in runtime for d in devices[runtime] if d['name'].startswith('iPhone')))
          ")
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Run unit tests
        run: |
          xcodebuild test \
            -project Spoiled.xcodeproj \
            -scheme Spoiled \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            -only-testing:SpoiledTests \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
